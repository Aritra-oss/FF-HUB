<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Can We Be Friends Again? 🌸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffc1d9);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Flower decorations */
        .flower {
            position: fixed;
            font-size: 35px;
            animation: float 5s ease-in-out infinite;
            opacity: 0.8;
            pointer-events: none;
        }

        .f1 { top: 5%; left: 8%; }
        .f2 { top: 15%; right: 8%; animation-delay: 1s; }
        .f3 { bottom: 10%; left: 10%; animation-delay: 2s; }
        .f4 { bottom: 15%; right: 10%; animation-delay: 3s; }
        .f5 { top: 45%; left: 3%; animation-delay: 1.5s; }
        .f6 { top: 50%; right: 3%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(8deg);
            }
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(180, 70, 120, 0.2);
            border: 2px solid rgba(255, 150, 190, 0.5);
            position: relative;
            z-index: 2;
        }

        .message {
            font-size: 22px;
            line-height: 1.8;
            color: #7d3156;
            margin-bottom: 25px;
        }

        .question {
            font-size: 26px;
            font-weight: bold;
            color: #d13f79;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 13px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: Georgia, "Times New Roman", serif;
        }

        #yesBtn {
            background: #e94f8a;
            color: white;
            box-shadow: 0 5px 15px rgba(233, 79, 138, 0.35);
        }

        #noBtn {
            background: #ffd0df;
            color: #a52e5d;
        }

        button:hover {
            transform: scale(1.08);
        }

        #noContent {
            display: none;
            margin-top: 25px;
        }

        #cobra {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(120, 40, 70, 0.3);
        }

        .cobraText {
            font-size: 20px;
            font-weight: bold;
            color: #a52e5d;
            line-height: 1.5;
        }

        /* Full-page YES screen */
        #yesScreen {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        #monkey {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 500px) {
            .message {
                font-size: 19px;
            }

            .question {
                font-size: 23px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                padding: 12px 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Flower decorations -->
    <div class="flower f1">🌸</div>
    <div class="flower f2">🌷</div>
    <div class="flower f3">🌺</div>
    <div class="flower f4">🌸</div>
    <div class="flower f5">🌼</div>
    <div class="flower f6">🌷</div>

    <!-- Main content -->
    <div class="container" id="mainContent">

        <div class="message">
            টুনটুনি, আমার তোর প্রতি অভিমান হওয়ার কারণে আমি তোকে
            ব্লক করে দিয়েছিলাম, কিন্তু এখন আমি আমার ভুল বুঝতে পেরেছি..
        </div>

        <div class="question">
            So, Can we be friends again?
        </div>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="sayNo()">No</button>
        </div>

        <!-- Appears after No -->
        <div id="noContent">
            <img src="cobra.webp" id="cobra" alt="Cobra">

            <div class="cobraText">
                গাঁড়ে গুলি মারব আমাশা হাগবি, Yes click kor
            </div>
        </div>

    </div>

    <!-- Appears after Yes -->
    <div id="yesScreen">
        <img src="monkey.jpeg" id="monkey" alt="Monkey">
    </div>

    <!-- Audio -->
    <audio id="dostoAudio" src="dosto.mp3"></audio>

    <script>
        function sayYes() {
            // Hide the original page
            document.getElementById("mainContent").style.display = "none";

            // Show monkey full-screen
            document.getElementById("yesScreen").style.display = "block";

            // Start audio
            const audio = document.getElementById("dostoAudio");
            audio.currentTime = 0;
            audio.play().catch(error => {
                console.log("Audio could not autoplay:", error);
            });
        }

        function sayNo() {
            // Show cobra and message
            document.getElementById("noContent").style.display = "block";
        }
    </script>

</body>
</html>
