
      <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Surprise For You 🌸</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        font-family: Georgia, "Times New Roman", serif;

        background:
            radial-gradient(circle at top left, #ffd6e7, transparent 35%),
            radial-gradient(circle at bottom right, #ffc1d9, transparent 35%),
            linear-gradient(135deg, #fff0f6, #ffd1e3);
    }

    .container {
        position: relative;
        width: 90%;
        max-width: 500px;
        padding: 55px 25px;

        text-align: center;

        background: rgba(255, 255, 255, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 30px;

        box-shadow:
            0 15px 40px rgba(170, 70, 110, 0.18),
            inset 0 0 25px rgba(255, 255, 255, 0.4);

        backdrop-filter: blur(10px);
    }

    h1 {
        margin: 0 0 35px;

        color: #b83268;
        font-size: clamp(30px, 8vw, 48px);
        font-weight: normal;
        line-height: 1.2;

        text-shadow: 2px 3px 8px rgba(150, 40, 90, 0.15);
    }

    .go-button {
        display: inline-block;

        padding: 14px 35px;

        border: none;
        border-radius: 50px;

        background: linear-gradient(135deg, #e75480, #c93668);
        color: white;

        font-size: 20px;
        font-family: Georgia, "Times New Roman", serif;

        text-decoration: none;

        cursor: pointer;

        box-shadow: 0 8px 20px rgba(190, 50, 100, 0.3);

        transition: 0.25s ease;
    }

    .go-button:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 12px 25px rgba(190, 50, 100, 0.4);
    }

    .go-button:active {
        transform: scale(0.96);
    }

    /* Floating flowers */
    .flower {
        position: absolute;
        font-size: 30px;
        opacity: 0.75;
        animation: float 5s ease-in-out infinite;
        pointer-events: none;
    }

    .f1 { top: 8%; left: 8%; animation-delay: 0s; }
    .f2 { top: 15%; right: 8%; animation-delay: 1s; }
    .f3 { bottom: 12%; left: 7%; animation-delay: 2s; }
    .f4 { bottom: 8%; right: 9%; animation-delay: 3s; }
    .f5 { top: 45%; left: 2%; animation-delay: 1.5s; }
    .f6 { top: 42%; right: 2%; animation-delay: 2.5s; }

    @keyframes float {
        0%, 100% {
            transform: translateY(0) rotate(0deg);
        }

        50% {
            transform: translateY(-15px) rotate(8deg);
        }
    }

    /* Small falling petals */
    .petal {
        position: absolute;
        top: -30px;
        color: #e75480;
        font-size: 20px;
        animation: fall linear infinite;
        opacity: 0.6;
        pointer-events: none;
    }

    .p1 { left: 15%; animation-duration: 7s; }
    .p2 { left: 35%; animation-duration: 9s; animation-delay: 2s; }
    .p3 { left: 60%; animation-duration: 8s; animation-delay: 1s; }
    .p4 { left: 80%; animation-duration: 10s; animation-delay: 3s; }

    @keyframes fall {
        from {
            transform: translateY(-40px) rotate(0deg);
        }

        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }
</style>
</head>

<body>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌸</div>
<div class="flower f5">🌼</div>
<div class="flower f6">🌷</div>

<div class="petal p1">🌸</div>
<div class="petal p2">🌸</div>
<div class="petal p3">🌷</div>
<div class="petal p4">🌸</div>

<div class="container">

    <h1>Here's a surprise for you</h1>

    <button class="go-button" onclick="playMusic()">
        Go--&gt;
    </button>

    <audio id="music" src="memememe.mp3"></audio>

</div>

<script>
function playMusic() {
    const music = document.getElementById("music");

    music.currentTime = 0;
    music.play();
}
</script>

</body>
</html>
